name: thaikit

# The DEFAULT stack is development: source is bind-mounted, not baked. Edit a
# file under web/client/src and the page hot-reloads; edit one under
# web/server/src and the process restarts. Nothing needs rebuilding.
#
# Rebuild the image ONLY when a dependency changes -- package.json or
# package-lock.json -- because node_modules lives in the image, not the mount.
#
# To run the shipped production image instead (client compiled into the image,
# no dev dependencies): docker compose -f compose.prod.yaml up -d --build
services:
  web:
    build:
      context: .
      target: dev
    image: thaikit/web:dev
    container_name: thaikit-web
    # Bound to loopback on purpose: this API has no auth and can delete files
    # from disk. Change it deliberately if you want it on the LAN.
    ports:
      - "127.0.0.1:${THAIKIT_PORT:-3733}:3733"
    user: "${THAIKIT_UID:-1000}:${THAIKIT_GID:-1000}"
    environment:
      # NOT "production" is the entire dev switch: web/server/src/paths.js reads
      # it as IS_DEV, and app.js then mounts Vite as middleware on this same
      # port, so HMR needs no second port, no proxy and no CORS.
      NODE_ENV: development
      PORT: "3733"
      THAIKIT_REPO_ROOT: /repo
      THAIKIT_REGISTRY_PATH: /repo/registry.json
      THAIKIT_ASSETS_DIR: /repo/assets
      THAIKIT_SCRATCH_DIR: /repo/scratch
      # Required on WSL2 and macOS: host writes do not deliver inotify events
      # across a bind mount, so without polling the UI never sees the
      # generation skills' work at all. Vite's own file watcher reads the same
      # flag (web/client/vite.config.js), which is what makes HMR fire for an
      # edit made on the host rather than inside the container.
      THAIKIT_WATCH_POLL: "1"
      THAIKIT_WATCH_INTERVAL: "1000"
      # Keep Vite's dependency pre-bundle OUT of /app. Inside it, the optimizer's
      # temp writes are seen by `node --watch` as a source change and the server
      # restart-loops. See the comment in web/client/vite.config.js.
      THAIKIT_VITE_CACHE: /tmp/vite-cache
    volumes:
      # The repo twice, deliberately, because the app and its data are separate
      # roots: /app is the code the server runs, /repo is the registry and the
      # generated kit it reads and writes.
      - ./:/repo
      - ./:/app
      # NOTHING masks the mount, and NOTHING is ever run on the host.
      #
      # The container is the environment; the host is storage. Every tool this
      # project builds with -- node, npm, vite, esbuild -- lives in the image
      # and runs inside a container. The host contributes source files and a
      # place to keep what the container writes, and nothing else. There is no
      # Node on the host's critical path, so there is no host Node version to
      # match, no host glibc to match, and no "works on my machine".
      #
      # node_modules is therefore INSTALLED BY THE CONTAINER, INTO THE MOUNT:
      #
      #   docker compose run --rm --no-deps -e HOME=/tmp \
      #     -e npm_config_cache=/tmp/npm-cache web npm ci
      #
      # It lands at ./node_modules on the host because /app is this directory,
      # owned by the host user because the service runs as ${THAIKIT_UID}. That
      # is the point: it persists across `docker compose down`, it is one tree
      # rather than one per container, and it was still produced by the image's
      # own toolchain. Never run `npm` on the host to produce it.
      #
      # This used to be four anonymous volumes holding a node_modules installed
      # inside the image, and the cost was a whole class of failure that only
      # ever looked like a broken app: an anonymous volume is seeded ONCE and
      # survives `docker compose build`, so a dependency change on the host
      # reached the container only after someone remembered
      # `--renew-anon-volumes` AND rebuilt the image. Renaming two workspace
      # packages to their published scope left the container crash-looping on
      # `Cannot find package '@thai-kit/level-schema'` for twelve hours against
      # a source tree that was already correct.
      #
      # What the volumes were guarding against does not apply here: host and
      # container are both linux-x64-gnu on Node 22 (same module ABI), and the
      # container's glibc is OLDER than the host's, so every prebuilt binary
      # the host installs -- sharp/libvips, esbuild, rollup -- runs inside it.
      # If that ever stops being true, the fix is a devcontainer that installs
      # on the same base image, not a volume that hides the mount.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3733/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      # Longer than production's: the first request compiles the client, and
      # Vite's dependency pre-bundle is a cold-start cost paid once.
      start_period: 30s
      retries: 3
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
