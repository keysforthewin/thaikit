name: thaikit

# The PRODUCTION stack. It mounts the project exactly the way the dev stack
# does, for exactly the same reason: the container is the ENVIRONMENT, the host
# is storage, and nothing that belongs to the project is ever baked into an
# image or run on the host.
#
# The ONLY differences from compose.yaml are NODE_ENV=production and the build
# target, which together decide how the client is served: dev mounts Vite as
# middleware and compiles from source on request, production serves the static
# bundle at web/client/dist. So production needs that bundle built first --
# by the container, into the mount:
#
#   docker compose run --rm --no-deps -e HOME=/tmp \
#     -e npm_config_cache=/tmp/npm-cache web npm ci
#   docker compose run --rm --no-deps -e HOME=/tmp \
#     -e npm_config_cache=/tmp/npm-cache web npm run build --workspace @thaikit/client
#   docker compose -f compose.prod.yaml up -d
#
# `--build` is not in that last line and should not need to be: the image holds
# only the toolchain, so it changes when the Dockerfile does and at no other
# time. Rebuilding after a source or dependency change is a habit this layout
# exists to remove.
#
# Both stacks claim the same container name and the same port, so run one.
services:
  web:
    build:
      context: .
      target: runtime
    image: thaikit/web:local
    container_name: thaikit-web
    # Bound to loopback on purpose: this API has no auth and can delete files
    # from disk. Change it deliberately if you want it on the LAN.
    ports:
      - "127.0.0.1:${THAIKIT_PORT:-3733}:3733"
    user: "${THAIKIT_UID:-1000}:${THAIKIT_GID:-1000}"
    environment:
      NODE_ENV: production
      PORT: "3733"
      THAIKIT_REPO_ROOT: /repo
      THAIKIT_SCRATCH_DIR: /repo/scratch
      # THAIKIT_READ_ONLY=1 (from .env) turns the whole instance read-only: every
      # mutating /api call answers 403, the bake cannot be started, and the
      # client hides its save, delete, upload and export controls. Unset, the
      # stack is read/write -- the default for working locally.
      THAIKIT_READ_ONLY: ${THAIKIT_READ_ONLY:-}
      # THAIKIT_BASE_PATH=/thaikit serves the app under a URL prefix, for a
      # reverse proxy that mounts it beside other sites. Vite bakes it into the
      # client, so a PRODUCTION build must be made with the same value set.
      THAIKIT_BASE_PATH: ${THAIKIT_BASE_PATH:-}
      # Required on WSL2 and macOS: host writes do not deliver inotify events
      # across a bind mount, so without polling the UI never sees the
      # generation skills' work at all.
      THAIKIT_WATCH_POLL: "1"
      THAIKIT_WATCH_INTERVAL: "1000"
      # Blender's Cycles bake runs on the GPU in here. NVIDIA_VISIBLE_DEVICES and
      # NVIDIA_DRIVER_CAPABILITIES are what the nvidia container runtime reads to
      # decide what to inject; `compute` is CUDA and OptiX, `utility` is
      # nvidia-smi. On WSL2 the runtime mounts the Windows driver's own libraries
      # into the container (/usr/lib/wsl/drivers/...), which is where ldconfig
      # then finds libcuda.so.1 AND libnvoptix_loader.so.1 -- so bake_lightmap.py's
      # OPTIX -> CUDA -> HIP probe lands on OPTIX, the same backend the bake used
      # when Blender ran on Windows.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Blender and npm both want somewhere to write. Without it they land on /,
      # which the container user cannot write.
      HOME: /tmp
      # The HOST bake agent (`npm run level:bake-agent`, on the host). The web
      # server spawns every bake in here, and in here there is no blender.exe
      # and no /mnt/c -- so "host Blender" in the export dialog hands the Blender
      # step to that agent over HTTP. host.docker.internal is mapped below.
      THAIKIT_BAKE_AGENT_URL: http://host.docker.internal:${THAIKIT_BAKE_AGENT_PORT:-3734}
      THAIKIT_BAKE_AGENT_TOKEN: ${THAIKIT_BAKE_AGENT_TOKEN:-}
      # Where a finished level goes. The bake copies build/level.glb to
      # $THAIKIT_EXPORT_DIR/<id>.glb -- the game's GLB folder, mounted below at
      # /export -- and the dialog prints the HOST spelling of that path.
      # The repo as the HOST spells it, for messages that tell a person what to
      # type in a host terminal (the export dialog's "start the bake agent" command).
      THAIKIT_REPO_HOST: ${PWD}
      THAIKIT_EXPORT_DIR: /export
      THAIKIT_EXPORT_DIR_HOST: ${THAIKIT_EXPORT_DIR:-${PWD}/../Operation-X/GLB}
    # The GPU reservation. `docker compose run` honours this too, which is what
    # makes `docker compose run --rm web node scripts/level/bake-level.mjs`
    # a GPU bake and not a very slow CPU one. Requires nvidia-container-toolkit
    # on the host and `nvidia` registered as a docker runtime
    # (`sudo nvidia-ctk runtime configure --runtime=docker`).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    volumes:
      # The repo twice, as in compose.yaml: /app is the code the server runs,
      # /repo is the registry and the generated kit it reads and writes. The
      # production stack used to mount /repo ALONE, so the code it ran was a
      # copy frozen inside the image while the code on disk moved on -- which
      # is how it came to be missing @thai-kit/level-schema entirely.
      - ./:/repo
      - ./:/app
      # The game's GLB folder, where every finished level is delivered.
      - ${THAIKIT_EXPORT_DIR:-../Operation-X/GLB}:/export
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3733/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
