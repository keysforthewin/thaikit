# thaikit under https://outdoordevs.com/thaikit -- paste inside the
# outdoordevs.com `server { listen 443 ssl; ... }` block.
#
# The app is mounted at THAIKIT_BASE_PATH=/thaikit and serves its own prefix, so
# proxy_pass has NO trailing slash: the prefix goes through untouched. Generated
# from DEPLOY_URL=https://outdoordevs.com/thaikit; the port is THAIKIT_PORT.

location = /thaikit { return 301 /thaikit/; }

location /thaikit/ {
    proxy_pass http://127.0.0.1:3733;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # /thaikit/api/events is a server-sent event stream: never buffer it, and
    # do not time it out at nginx's default 60 s.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    # Umami tag (added 2026-09-24): thaikit is its own property with its own
    # website entry. This sub_filter REPLACES the inherited server-level one,
    # which until then counted thaikit as Outdoor Devs traffic. Do not delete it.
    # Checked daily by umami-tagcheck.sh (umami-bridge repo) as `thaikit`.
    # Ask the app for uncompressed bodies so the sub_filter can see the HTML;
    # nginx's own gzip recompresses on the way out.
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<script defer src="/pulse/script.js" data-website-id="07808e83-277f-4553-aa79-22b173a02ed5"></script></head>';
    sub_filter_once on;
    sub_filter_types text/html;
    # Level GLBs run to ~160 MB; the app itself refuses uploads (read-only).
    proxy_max_temp_file_size 0;
    client_max_body_size 1m;
}
