<!doctype html>
<meta charset="utf-8">
<title>thaikit render harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #3a3a3a; overflow: hidden; }
  canvas { display: block; }
</style>
<!-- Everything is local and version-pinned, so renders are reproducible and work
     offline. This three instance is also the one handed to the model module:
     the factory is bundled with `three` external, so it asks for three and gets
     THIS one rather than loading a second copy. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const SIZE = 1024;
const BACKGROUND = 0x3a3a3a;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);            // fixed, so renders are byte-comparable
renderer.setSize(SIZE, SIZE, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BACKGROUND);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);

// A fixed three-point rig in code -- no HDR file dependency, so every render of
// the same GLB is identical.
const lights = new THREE.Group();
lights.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4);
const fill = new THREE.DirectionalLight(0xffffff, 0.9); fill.position.set(-4, 2, 3);
const rim = new THREE.DirectionalLight(0xffffff, 1.1); rim.position.set(0, 3, -5);
lights.add(key, fill, rim);
scene.add(lights);

let model = null;
const sphere = new THREE.Sphere(new THREE.Vector3(), 1);
const originalMaterials = new Map();

// Diagnostics ONLY -- never sequencing. A map that 404s would otherwise sit in
// the wait below until the deadline and then be measured as simply absent,
// which is the same silent grey surface a missing texture always is.
const loadErrors = [];
THREE.DefaultLoadingManager.onError = function (url) { loadErrors.push(url); };

// displacementMap and alphaMap were missing from the old inline list: a prop
// that ships a height map paid VRAM this never counted.
const MAP_KEYS = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap',
                  'aoMap', 'displacementMap', 'alphaMap'];

/**
 * A texture is measurable once its image has decoded. A CanvasTexture is born
 * that way; one from TextureLoader is not, and it is handed back before the
 * bytes arrive.
 */
function textureReady(t) {
  const img = t && t.image;
  if (!img) return false;
  return !!(img.width || img.videoWidth || img.data);
}

/**
 * Textures load asynchronously, and BOTH the measurement below and the
 * screenshots the caller takes straight afterwards would otherwise see an empty
 * material -- 0 textures, 0 bytes and an untextured render, which is a valid PNG
 * of the wrong thing.
 *
 * Polling the collected Texture objects rather than DefaultLoadingManager.onLoad
 * is deliberate: onLoad never fires for a prop that loads nothing, so every
 * procedural prop in the kit would hang here until timeout. An empty list
 * resolves on the first pass.
 */
async function waitForTextures(textures, timeoutMs) {
  const deadline = performance.now() + (timeoutMs || 20000);
  for (;;) {
    const pending = textures.filter(function (t) { return !textureReady(t); });
    if (!pending.length) break;
    // Every straggler has already failed; waiting out the deadline adds nothing.
    if (loadErrors.length >= pending.length) break;
    if (performance.now() >= deadline) break;
    await new Promise(function (r) { requestAnimationFrame(r); });
  }
  return {
    pending: textures.filter(function (t) { return !textureReady(t); }).length,
    errors: loadErrors.slice()
  };
}

// The UV-checker and albedo passes went with the GLB rubric they served: this
// pipeline emits code, so there is no unwrap to inspect and no baked-in
// lighting to isolate. Clay and wire survive because they are what a silhouette
// and a topology read need.
const MATERIALS = {
  clay: function () { return new THREE.MeshStandardMaterial({ color: 0xb0b0b0, roughness: 0.85, metalness: 0 }); },
  wire: function () { return new THREE.MeshBasicMaterial({ color: 0x8fd9ff, wireframe: true }); },
  normal: function () { return new THREE.MeshNormalMaterial({ flatShading: true }); }
};

/**
 * A stand-in for `three/tsl` on a WebGL renderer -- the same trade the editor
 * makes: every property is a callable returning the same proxy, so a node
 * material degrades to the plain material it was assigned onto instead of
 * throwing at module scope. See web/client/src/three/tslStub.js.
 */
let tslProxy = null;
function tslStub() {
  if (!tslProxy) {
    const handler = {
      get: function (t, prop) {
        if (prop === Symbol.toPrimitive) return function () { return 0; };
        if (prop === 'then') return undefined;
        if (prop === '__esModule') return true;
        return tslProxy;
      },
      apply: function () { return tslProxy; },
      construct: function () { return tslProxy; },
      has: function () { return true; }
    };
    tslProxy = new Proxy(function tsl() {}, handler);
  }
  return tslProxy;
}

/** Release everything one model owns: geometries, materials and their maps. */
function disposeTree(root) {
  const seen = new Set();
  root.traverse(function (o) {
    if (o.geometry && !seen.has(o.geometry.uuid)) { seen.add(o.geometry.uuid); o.geometry.dispose(); }
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      if (seen.has(m.uuid)) continue;
      seen.add(m.uuid);
      for (const k of MAP_KEYS) if (m[k] && m[k].dispose) m[k].dispose();
      m.dispose();
    }
  });
  originalMaterials.clear();
}

window.__thaikit = {
  /**
   * Run the built factory and put its Group in the scene.
   *
   * The module is CommonJS with `three` external (see build-model-module.mjs),
   * so it is evaluated rather than imported and handed the THREE above. That is
   * what makes the factory's Mesh the same class as the renderer's Mesh -- a
   * second copy of three would render nothing and explain nothing.
   */
  async load(url, exportName) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch ' + url + ': ' + res.status + ' ' + res.statusText);
    const code = await res.text();

    const mod = { exports: {} };
    new Function('module', 'exports', 'require', code)(mod, mod.exports, function (name) {
      if (name === 'three') return THREE;
      // A vibe3d pack item is the same module shape as a thaikit factory, so it
      // renders here too -- but it may ask for three/webgpu and three/tsl. Both
      // are answered exactly as the level editor answers them
      // (web/client/src/three/modelModule.js): webgpu re-exports the scene graph
      // from the shared three.core.js, so it IS this THREE, and TSL degrades to
      // a proxy so one model building a node material does not cost the pack
      // every model that merely imports the shared file. thaikit's own factories
      // ask for neither, so nothing about their renders changes.
      if (name === 'three/webgpu') return THREE;
      if (name === 'three/tsl') return tslStub();
      // Anything else is a bundling mistake, not a runtime one: the factory is
      // supposed to import three and nothing else. Say which, so the fix is
      // obvious rather than a blank canvas.
      throw new Error('model module required "' + name + '"; only "three" is provided');
    });

    const factory = mod.exports[exportName || 'createObjectModel'] || mod.exports.default;
    if (typeof factory !== 'function') {
      throw new Error(
        'no factory export; expected "' + (exportName || 'createObjectModel') +
        '" or a default, got: ' + Object.keys(mod.exports).join(', ')
      );
    }

    // A single page loads one model per asset run -- but the pack preview pass
    // walks a hundred items through this same page, and three frees nothing on
    // its own. Left undisposed, each one's geometries, materials and synthesised
    // canvases stay resident until the GPU gives up somewhere around item sixty.
    if (model) { scene.remove(model); disposeTree(model); model = null; }
    // The module is eval'd, not imported: it has no import.meta and no
    // currentScript, so it cannot resolve its own shipped files. A bare relative
    // path would resolve against THIS document instead, which is a different
    // place here than it is in the web app. Hand it the base explicitly.
    const baseUrl = new URL('.', new URL(url, location.href)).href;
    model = factory({}, { baseUrl: baseUrl });
    if (!model || !model.isObject3D) throw new Error('factory did not return an Object3D');
    scene.add(model);
    model.updateMatrixWorld(true);

    let triangles = 0, vertices = 0, drawCalls = 0;
    const materials = new Set();
    // Distinct geometries, not distinct meshes. Two meshes sharing one geometry
    // cost one upload and one VRAM footprint between them, and the GAP between
    // this count and drawCalls is the only visible evidence that a repeated part
    // became an InstancedMesh rather than N copies.
    const geometries = new Set();
    const textures = [];
    model.traverse(function (o) {
      if (!o.isMesh) return;
      originalMaterials.set(o.uuid, o.material);
      materials.add(o.material.uuid);
      drawCalls++;
      const g = o.geometry;
      geometries.add(g.uuid);
      // An InstancedMesh is ONE draw call and ONE geometry but N copies on screen,
      // and the GPU rasterises every one of them. Counting its geometry once would
      // report a 40-spoke wheel as 300 triangles and make instancing look free on
      // the axis where it is not.
      const copies = o.isInstancedMesh ? (o.count || 0) : 1;
      const meshVertices = g.attributes.position ? g.attributes.position.count : 0;
      vertices += meshVertices * copies;
      triangles += (g.index ? g.index.count / 3 : meshVertices / 3) * copies;

      // A procedural factory can generate canvas textures and a textured one can
      // load files; both cost VRAM the same way. Collect them here and measure
      // after the wait below -- a loaded texture has no image yet.
      for (var i = 0; i < MAP_KEYS.length; i++) {
        var tex = o.material[MAP_KEYS[i]];
        if (tex && textures.indexOf(tex) === -1) textures.push(tex);
      }
    });

    const tLoad0 = performance.now();
    const texWait = await waitForTextures(textures, 20000);
    const textureMs = Math.round(performance.now() - tLoad0);

    const images = new Set();
    let gpuBytes = 0;
    for (var ti = 0; ti < textures.length; ti++) {
      var timg = textures[ti].image;
      if (!timg || images.has(timg)) continue;
      images.add(timg);
      gpuBytes += Math.round((timg.width || 0) * (timg.height || 0) * 4 * (4 / 3));
    }

    const box = new THREE.Box3().setFromObject(model);
    box.getBoundingSphere(sphere);

    // sculptRuntime is the contract img2threejs is asked to honour: the named
    // pivots and sockets for everything that moves. Reported here so the render
    // pass is also what records them.
    const rt = model.userData && model.userData.sculptRuntime;
    return {
      triangles: triangles, vertices: vertices, drawCalls: drawCalls,
      materials: materials.size, uniqueGeometries: geometries.size,
      textures: images.size, gpuBytesEstimate: gpuBytes,
      textureMs: textureMs, texturesPending: texWait.pending, textureErrors: texWait.errors,
      bounds: { min: box.min.toArray(), max: box.max.toArray() },
      radius: sphere.radius,
      runtime: rt ? {
        nodes: rt.nodes || 0,
        sockets: (rt.sockets || []).map(function (s) { return s && s.name ? s.name : String(s); }),
        pivots: (rt.pivots || []).map(function (s) { return s && s.name ? s.name : String(s); }),
        destructionGroups: (rt.destructionGroups || []).map(function (s) { return s && s.name ? s.name : String(s); })
      } : null
    };
  },

  setMode(mode) {
    model.traverse(function (o) {
      if (!o.isMesh) return;
      if (mode === 'beauty') {
        o.material = originalMaterials.get(o.uuid);
      } else {
        o.material = MATERIALS[mode]();
      }
    });
  },

  /** Frame the bounding sphere identically at every angle, so passes align. */
  setCamera(azimuthDeg, elevationDeg) {
    const az = THREE.MathUtils.degToRad(azimuthDeg);
    const el = THREE.MathUtils.degToRad(elevationDeg);
    // r / sin(fov/2) is the distance at which the bounding sphere is exactly
    // tangent to the frustum. Anything below ~1.0 crops props whose height
    // approaches their bounding-sphere diameter -- a 0.88 m drum lost its rims
    // at 0.62. Stay just inside the tangent fit so every prop is whole, with a
    // little margin, and framed identically pass to pass.
    const dist = (sphere.radius / Math.sin(THREE.MathUtils.degToRad(35) / 2)) * 0.92;
    // The clip planes follow the fit. They were a fixed 0.01..100, which is fine
    // for a 20 m building and clips a 300 m skyline imposter (dist ~480 m) out of
    // the frame entirely -- a blank render that the coverage gate then reports
    // as a SwiftShader fault. Near scales with distance so depth precision on a
    // large prop is not spent on the centimetre in front of the lens.
    camera.near = Math.max(0.01, dist * 0.001);
    camera.far = Math.max(100, dist + sphere.radius * 4);
    camera.position.set(
      sphere.center.x + dist * Math.cos(el) * Math.sin(az),
      sphere.center.y + dist * Math.sin(el),
      sphere.center.z + dist * Math.cos(el) * Math.cos(az)
    );
    camera.lookAt(sphere.center);
    camera.updateProjectionMatrix();
  },

  render() {
    renderer.render(scene, camera);
    return true;
  },

  /** Mean luma, used to assert the GPU actually drew something. */
  // Fraction of pixels that differ from the BACKDROP. This is the real emptiness test:
  // a blank frame is uniformly the backdrop and scores ~0 here whatever its brightness,
  // whereas mean luma alone cannot tell "nothing was drawn" from "something dark was
  // drawn". A correctly rendered dark prop pulls mean luma BELOW the empty-frame value,
  // so a brightness threshold rejects exactly the props it should accept.
  subjectCoverage() {
    const gl = renderer.getContext();
    const px = new Uint8Array(SIZE * SIZE * 4);
    gl.readPixels(0, 0, SIZE, SIZE, gl.RGBA, gl.UNSIGNED_BYTE, px);
    // Backdrop sampled from a corner rather than hardcoded, so this keeps working if the
    // harness background ever changes.
    const br = px[0], bg = px[1], bb = px[2];
    let differing = 0;
    for (let i = 0; i < px.length; i += 4) {
      if (Math.abs(px[i] - br) + Math.abs(px[i + 1] - bg) + Math.abs(px[i + 2] - bb) > 18) differing += 1;
    }
    return differing / (SIZE * SIZE);
  },

  meanLuma() {
    const gl = renderer.getContext();
    const px = new Uint8Array(SIZE * SIZE * 4);
    gl.readPixels(0, 0, SIZE, SIZE, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let sum = 0;
    for (let i = 0; i < px.length; i += 4) {
      sum += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
    }
    return sum / (SIZE * SIZE);
  }
};

window.__thaikitReady = true;
</script>
